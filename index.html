<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFL BULB - Portfolio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@700&display=swap');

    :root {
      --red: #ff1a1a;
      --deep: #9c0a0a;
      --pink: #ff2a8f;
      --orange: #ff6600;
      --yellow: #ffd000;
      --cyan: #00f0ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: white;
      background: #0a0202;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Nome fisso in alto a sinistra */
    .identity {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      font-family: 'Inter';
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      backdrop-filter: blur(10px);
      background:rgba(0,0,0,0.3);
      padding:10px;
      border-radius: 5px;
    }

    /* Hero - Concentric Geometric Blocks */
    .hero {
      height: 100vh;
      background: linear-gradient(135deg, var(--deep) 0%, #1a0000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* I bordi del rettangolo Pop-Rothko */
    .hero::before {
      content: '';
      position: absolute;
      inset: 6%;
      border: 6px solid var(--pink);
      box-shadow: 0 0 0 20px var(--orange),
                  0 0 0 40px var(--yellow),
                  0 0 0 60px var(--cyan);
      pointer-events: none;
      opacity: 0.85;
      z-index: 1;
    }

    /* Wrapper per l'immagine centrale */
    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 72%;
      height: 70%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-wrapper img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      filter: drop-shadow(0 0 30px rgba(0,0,0,0.5));
    }

    /* Navigazione in alto a destra */
    .nav {
      position: absolute;
      top: 40px;
      right: 40px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    button {
      padding: 12px 28px;
      border: none;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-secondary { background: #eee; color: #111; }
    .btn-primary {
      background: var(--red);
      color: white;
      box-shadow: 0 0 0 4px #fff, 0 0 0 8px var(--pink);
    }
    
    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 0 0 5px #fff, 0 0 0 10px var(--pink);
    }

    /* Seconda Sezione (Dettagli Tecnici) */
    .section {
      padding: 100px 10%;
      background: #140000;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .text-block h2 {
      font-size: 3.5rem;
      color: var(--yellow);
      margin-bottom: 2rem;
      line-height: 1;
    }

    .text-block p {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <div class="identity">
    RICCARDO VENTURI<br>
    <span style="font-size: 0.8rem; opacity: 0.6; font-weight: 400;">CAGLIARI, ITALY</span>
    <a href="https://www.linkedin.com/in/riccardo-venturi-1937573b1" target="_blank" style="color: var(--cyan); font-size: 0.7rem; text-decoration: none; font-weight: 700;">LINKEDIN ↗</a>
  </div>

  <section class="hero">
    <div class="nav">
      <a href="projects.html"><button class="nav-btn">PROJECTS</button></a>
      
      <button class="btn-primary">DOWNLOAD CV</button>
    </div>

    <div class="content-wrapper">
      <!-- L'IMMAGINE ORA È AL CENTRO DEI BORDI -->
      <a href="assets/CFL RENDER 3D BLENDER.png" target="_blank">
        <img src="assets/CFL RENDER 3D BLENDER.png" alt="Progetto Light Bulb CFL">
      </a>
    </div>
  </section>

  <!-- Sezione descrittiva sotto -->
  <section class="section">
    <div class="text-block">
      <h2>CFL BULB DESIGN</h2>
      <p>Modellazione parametrica avanzata eseguita in <b>Onshape/CAD like Solidworks</b> con l'uso di eliche variabili. Rendering fotorealistico in <b>Blender Cycles</b> con studio dei materiali e della rifrazione del vetro.</p>
      <a href="Vermilion2boc.html">
        <button class="btn-primary">VEDI ALTRI PROGETTI →</button>
      </a>
    </div>
    <div style="border: 10px solid var(--cyan); padding: 10px; background: rgba(255,255,255,0.05); width:118%">
       <!-- Qui potresti mettere uno screenshot dell'albero delle feature -->
       <img src="assets/Onshape CFL BULB LIGHT.png" alt="Feature Tree/Onshape modeling" style="width:100%; opacity: 0.7;cursor: zoom-in;"onclick="openLightbox(this.src)">
    </div>
  </section>
<!-- Lightbox per ingrandire immagini -->
<div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; cursor: zoom-out;">
  <img id="lightbox-img" style="max-width: 95%; max-height: 95%; border: 8px solid #ffcc00; box-shadow: 0 0 50px rgba(255,204,0,0.6);">
</div>

<script>
  // Funzione per aprire l'immagine in grande
  function openLightbox(imgSrc) {
    document.getElementById('lightbox-img').src = imgSrc;
    document.getElementById('lightbox').style.display = 'flex';
  }

  // Chiudi cliccando ovunque sul background
  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target.id === 'lightbox') {
      this.style.display = 'none';
    }
  });
</script>
</body>
<footer style="padding: 40px; text-align: center; background: #000; border-top: 1px solid var(--deep);">
    
    <a href="projects.html" style="text-decoration:none;"><button class="btn-secondary">ALL PROJECTS</button></a>
    <a href="Pagina_2_progetto_4.html" style="text-decoration:none;"><button class="btn-primary">NEXT PROJECT →</button></a>
</footer>
</html>
